# Render-blueprint. Lägg repot på GitHub, välj "New +" -> "Blueprint" i
# Render och peka på repot, så läses den här filen in och allt sätts upp.
#
# Efteråt måste två saker fyllas i under Environment (de är hemliga och får
# inte stå i filen): VVS_TOKEN och VVS_AI_NYCKEL. Se DEPLOY.md.
services:
  - type: web
    name: sysvvs-inventering
    runtime: python
    plan: starter            # starter krävs för att en disk ska kunna monteras
    # python3 -m pip (inte bara pip) så att paketet hamnar i samma Python som
    # startCommand kör. Sista kontrollen importerar QR-modulen med den Python
    # som faktiskt ska använda den — går det inte stannar bygget här, i stället
    # för att appen publiceras med en QR-ruta som aldrig fylls i.
    buildCommand: >-
      python3 -m pip install -r requirements.txt
      && python3 -c "import qrcode.image.svg; print('QR-modulen är på plats')"
    startCommand: python3 server.py
    healthCheckPath: /       # startsidan är öppen; /api/* kräver token
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: VVS_KRAV_TOKEN  # proxy -> alla besök ser ut att vara lokala
        value: "1"
      - key: VVS_DATA       # disken nedan monteras här
        value: /var/data
      - key: VVS_CONFIG
        value: /var/data/config.json
      - key: VVS_AI_LEVERANTOR
        value: gemini
      - key: VVS_TOKEN      # fylls i i Render, sync: false = frågas efter
        sync: false
      - key: VVS_AI_NYCKEL
        sync: false
      # E-post — behövs för att kunna mejla kalkylarket *från molnet*. Det
      # konto som annars lånas från SYS.ASSIST finns bara på datorn, så här
      # måste det anges en gång. Använd ett applösenord (16 tecken), aldrig
      # det vanliga Google-lösenordet. Lämnas de tomma går allt utom
      # "Skicka kalkylarket" som vanligt.
      - key: VVS_MEJL_ADRESS
        sync: false
      - key: VVS_MEJL_NAMN
        sync: false
      - key: VVS_MEJL_SMTP_SERVER
        value: smtp.gmail.com
      - key: VVS_MEJL_SMTP_PORT
        value: "465"
      - key: VVS_MEJL_LOSENORD
        sync: false
      # Frivilligt — fyll i för att slippa skriva in det i appen:
      # - key: VVS_SKOLA
      #   value: Praktiska Uppsala
      # - key: VVS_PROGRAM
      #   value: VVS
    disk:
      name: vvsdata
      mountPath: /var/data
      sizeGB: 1
